name: CESM Integration

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly Monday midnight UTC
  workflow_dispatch:      # Manual trigger for PRs
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: read

jobs:
  cesm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Free disk space and configure podman storage on /mnt
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get autoremove -y
          docker system prune -af
          sudo mkdir -p /mnt/podman-storage
          sudo chown runner:runner /mnt/podman-storage
          mkdir -p $HOME/.config/containers
          printf '[storage]\ndriver = "overlay"\ngraphRoot = "/mnt/podman-storage"\n' \
            > $HOME/.config/containers/storage.conf
          df -h

      - name: Checkout mom6_forge
        uses: actions/checkout@v4
        with:
          path: mom6_forge_src

      - name: Checkout crocontainer (for NYF download script)
        uses: actions/checkout@v4
        with:
          repository: CROCODILE-CESM/crocontainer
          path: crocontainer

      - name: Cache NYF inputdata
        id: cache-nyf
        uses: actions/cache@v4
        with:
          path: nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('crocontainer/scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        if: steps.cache-nyf.outputs.cache-hit != 'true'
        run: bash ${{ github.workspace }}/crocontainer/scripts/download_nyf_inputdata.sh ${{ github.workspace }}/nyf_inputdata

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        run: podman pull --platform linux/amd64 ghcr.io/crocodile-cesm/crocontainer:latest-amd64

      - name: Create scratch directory
        run: mkdir -p cesm_scratch

      - name: Run CESM integration (setup + build + submit)
        run: |
          podman run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}/nyf_inputdata:/root/cesm/inputdata" \
            -v "${{ github.workspace }}/cesm_scratch:/root/cesm/scratch" \
            -v "${{ github.workspace }}/mom6_forge_src:/mom6_forge_src" \
            -e CIME_MACHINE=ubuntu-latest \
            -e CIME_OUTPUT_ROOT=/root/cesm/scratch \
            -e CESMROOT=/workspace/CESM \
            -e USER=root \
            -e DIN_LOC_ROOT=/root/cesm/inputdata \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              set -euo pipefail
              source /opt/conda/etc/profile.d/conda.sh
              conda activate CrocoDash
              unset NCAR_HOST
              git config --global user.name github-actions
              git config --global user.email github-actions@github.com

              pip install /mom6_forge_src

              python /mom6_forge_src/tests/integration/setup_ci_case.py

              conda deactivate

              export ESMFMKFILE=\$(find \${ESMF_INSTALL_PREFIX}/lib -name 'esmf.mk' | head -1)
              export OMPI_CC=gcc
              export OMPI_FC=gfortran
              export OMPI_CXX=g++
              cd /workspace/case
              ./xmlchange NTASKS=1
              ./case.setup --reset
              ./xmlchange DOUT_S=False
              ./xmlchange DIN_LOC_ROOT=/root/cesm/inputdata
              ./xmlchange STOP_OPTION=ndays
              ./xmlchange STOP_N=1
              ./case.build
              ./case.submit --no-batch

              # Copy case logs into scratch so they appear in artifacts
              cp -r /workspace/case/run/ /root/cesm/scratch/case_run/ 2>/dev/null || true
              cp -r /workspace/case/bld/ /root/cesm/scratch/case_bld/ 2>/dev/null || true
            "

      - name: Check run logs for errors
        run: |
          echo '--- checking run logs for errors ---'
          if grep -rq 'ERROR STOP\|MOM6 has crashed\|FATAL ERROR\|Abort\|cesm.log.*ERROR' ${{ github.workspace }}/cesm_scratch/ 2>/dev/null; then
            echo 'CESM run contained errors — see artifacts'
            exit 1
          fi

      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R runner:runner ${{ github.workspace }}/cesm_scratch || true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesm-run-output-${{ github.run_id }}
          path: ${{ github.workspace }}/cesm_scratch/
          if-no-files-found: warn
