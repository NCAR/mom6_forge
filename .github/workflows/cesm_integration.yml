name: CESM Integration

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly Monday midnight UTC
  workflow_dispatch:      # Manual trigger for PRs
  push:
    branches:
      - '*'

    

jobs:
  cesm-integration:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Checkout this mom6_forge commit
        uses: actions/checkout@v4
        with:
          path: mom6_forge_src

      - name: Checkout crocontainer (for NYF download script)
        uses: actions/checkout@v4
        with:
          repository: CROCODILE-CESM/crocontainer
          path: crocontainer

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        with:
          path: nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('crocontainer/scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        run: bash crocontainer/scripts/download_nyf_inputdata.sh ./nyf_inputdata

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CrocoDash case setup inside container
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v ${{ github.workspace }}/mom6_forge_src:/workspace/mom6_forge_src \
            -v ${{ github.workspace }}/nyf_inputdata:/root/cesm/inputdata \
            -e CESMROOT=/workspace/CESM \
            -e DIN_LOC_ROOT=/root/cesm/inputdata \
            -e CIME_MACHINE=ubuntu-latest \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh
              conda activate CrocoDash
              pip install /workspace/mom6_forge_src
              python /workspace/mom6_forge_src/tests/integration/setup_ci_case.py
            "
