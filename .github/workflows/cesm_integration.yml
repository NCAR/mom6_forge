name: CESM Integration

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly Monday midnight UTC
  workflow_dispatch:      # Manual trigger for PRs
  push:
    branches:
      - '**'

jobs:
  cesm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Checkout this mom6_forge commit
        uses: actions/checkout@v4
        with:
          path: mom6_forge_src

      - name: Checkout crocontainer (for NYF download script)
        uses: actions/checkout@v4
        with:
          repository: CROCODILE-CESM/crocontainer
          path: crocontainer

      - name: Cache NYF inputdata
        uses: actions/cache@v4
        with:
          path: nyf_inputdata
          key: nyf-inputdata-${{ hashFiles('crocontainer/scripts/nyf_inputdata_list.txt') }}

      - name: Download NYF inputdata
        run: bash crocontainer/scripts/download_nyf_inputdata.sh ./nyf_inputdata

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup, build, and run CESM inside container
        run: |
          mkdir -p ${{ github.workspace }}/case
          mkdir -p ${{ github.workspace }}/inputdir
          docker run --rm \
            --platform linux/amd64 \
            -v ${{ github.workspace }}/mom6_forge_src:/workspace/mom6_forge_src \
            -v ${{ github.workspace }}/nyf_inputdata:/root/cesm/inputdata \
            -v ${{ github.workspace }}/case:/workspace/case \
            -v ${{ github.workspace }}/inputdir:/workspace/inputdir \
            -e CESMROOT=/workspace/CESM \
            -e DIN_LOC_ROOT=/root/cesm/inputdata \
            -e CIME_MACHINE=ubuntu-latest \
            -e COPERNICUSMARINE_SERVICE_USERNAME=${{ secrets.GLORYS_USERNAME }} \
            -e COPERNICUSMARINE_SERVICE_PASSWORD=${{ secrets.GLORYS_PASSWORD }} \
            ghcr.io/crocodile-cesm/crocontainer:latest-amd64 \
            bash -c "
              source /opt/conda/etc/profile.d/conda.sh
              conda activate CrocoDash
              pip install /workspace/mom6_forge_src
              python /workspace/mom6_forge_src/tests/integration/setup_ci_case.py
              cd /workspace/case
              ./xmlchange STOP_OPTION=ndays
              ./xmlchange STOP_N=1
              ./case.build
              ./case.submit
            "

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesm-run-output
          path: |
            ${{ github.workspace }}/case/run/ocean.log.*
            ${{ github.workspace }}/case/run/MOM_parameter_doc.all
            ${{ github.workspace }}/case/run/*.nc
          if-no-files-found: warn
